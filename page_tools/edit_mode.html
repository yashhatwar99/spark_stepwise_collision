<style id="pg-edit-style">
#pg-edit-ui{position:fixed;right:16px;bottom:16px;z-index:2147483000;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px);font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#pg-edit-ui button{font:inherit;border:1px solid #6b7690;background:#1b2231;color:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#pg-edit-ui button.pg-main{background:#2557a7;border-color:#2557a7}
#pg-edit-ui button:disabled{opacity:.6;cursor:default}
#pg-edit-ui .pg-msg{background:#1b2231;color:#e5e9f1;border-radius:8px;padding:6px 10px;max-width:340px;font-weight:400;line-height:1.35}
body.pg-editing [data-pg-edit]{cursor:text}
body.pg-editing [data-pg-edit]:hover{outline:1.5px dashed #2557a7;outline-offset:2px}
body.pg-editing [data-pg-edit]:focus{outline:2px solid #2557a7;outline-offset:2px}
body.pg-editing svg text,body.pg-editing svg tspan{cursor:text}
body.pg-editing svg text:hover,body.pg-editing svg tspan:hover{text-decoration:underline dashed}
#pg-edit-pop{position:fixed;z-index:2147483001;background:#1b2231;border:1px solid #2557a7;border-radius:8px;padding:8px;display:flex;gap:6px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#pg-edit-pop input{width:min(420px,calc(100vw - 120px));font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:6px 8px;border-radius:6px;border:1px solid #6b7690;background:#fff;color:#000}
#pg-edit-pop button{font:500 13px -apple-system,sans-serif;border:0;border-radius:6px;padding:6px 10px;background:#2557a7;color:#fff;cursor:pointer}
</style>
<script id="pg-edit-script">
(function () {
  var SKIP = /^(SCRIPT|STYLE|TITLE|META|LINK|SVG|NOSCRIPT|TEXTAREA|INPUT|SELECT|OPTION|BUTTON)$/i;
  var on = false, ui = null, pop = null, msg = null, artifact = null;

  function hasOwnText(el) {
    for (var n = el.firstChild; n; n = n.nextSibling)
      if (n.nodeType === 3 && n.nodeValue.trim()) return true;
    return false;
  }
  function inSvg(el) { return !!(el.closest && el.closest("svg")); }
  function inUi(el) { return !!(el.closest && el.closest("#pg-edit-ui,#pg-edit-pop")); }

  function setEditable(yes) {
    var all = document.body.querySelectorAll("*");
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (yes) {
        if (SKIP.test(el.tagName) || inSvg(el) || inUi(el) || !hasOwnText(el)) continue;
        el.setAttribute("contenteditable", "true");
        el.setAttribute("data-pg-edit", "1");
      } else if (el.hasAttribute("data-pg-edit")) {
        el.removeAttribute("contenteditable");
        el.removeAttribute("data-pg-edit");
      }
    }
  }

  function say(t) { if (msg) { msg.textContent = t || ""; msg.style.display = t ? "" : "none"; } }

  function closePop() { if (pop) { pop.remove(); pop = null; } }
  function editSvgText(target, x, y) {
    closePop();
    var input = document.createElement("input");
    input.type = "text";
    input.value = target.textContent;
    pop = document.createElement("div");
    pop.id = "pg-edit-pop";
    var ok = document.createElement("button");
    ok.textContent = "OK";
    pop.appendChild(input);
    pop.appendChild(ok);
    document.body.appendChild(pop);
    pop.style.left = Math.max(8, Math.min(x, window.innerWidth - pop.offsetWidth - 8)) + "px";
    pop.style.top = Math.max(8, Math.min(y + 12, window.innerHeight - pop.offsetHeight - 8)) + "px";
    function commit() { target.textContent = input.value; closePop(); }
    ok.onclick = commit;
    input.onkeydown = function (e) {
      if (e.key === "Enter") commit();
      else if (e.key === "Escape") closePop();
    };
    input.focus();
    input.select();
  }

  function buildDoc() {
    var clone = document.body.cloneNode(true);
    var junk = clone.querySelectorAll("#pg-edit-ui,#pg-edit-pop");
    for (var i = 0; i < junk.length; i++) junk[i].remove();
    var marked = clone.querySelectorAll("[data-pg-edit],[contenteditable]");
    for (var j = 0; j < marked.length; j++) {
      marked[j].removeAttribute("contenteditable");
      marked[j].removeAttribute("data-pg-edit");
    }
    clone.classList.remove("pg-editing");
    if (!clone.getAttribute("class")) clone.removeAttribute("class");
    var styles = document.head.querySelectorAll("style"), reset = styles[0];
    for (var k = 0; k < styles.length; k++)
      if (styles[k].textContent.indexOf("scroll-padding-top") > -1) { reset = styles[k]; break; }
    var vp = document.head.querySelector("meta[name=viewport]");
    var vpc = (vp && vp.getAttribute("content")) || "width=device-width,initial-scale=1,viewport-fit=cover";
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"" + vpc + "\"><style>" +
      (reset ? reset.textContent : "") + "</style></head><body>" + clone.innerHTML + "</body></html>";
  }

  function build() {
    ui = document.createElement("div");
    ui.id = "pg-edit-ui";
    msg = document.createElement("span");
    msg.className = "pg-msg";
    msg.style.display = "none";
    var edit = document.createElement("button");
    edit.textContent = "✎ Edit text";
    var save = document.createElement("button");
    save.textContent = "Save";
    save.className = "pg-main";
    var cancel = document.createElement("button");
    cancel.textContent = "Cancel";
    save.style.display = cancel.style.display = "none";
    ui.appendChild(msg); ui.appendChild(edit); ui.appendChild(save); ui.appendChild(cancel);
    document.body.appendChild(ui);

    edit.onclick = function () {
      on = true;
      document.body.classList.add("pg-editing");
      setEditable(true);
      edit.style.display = "none";
      save.style.display = cancel.style.display = "";
      say("Click any text to change it. Then press Save.");
    };
    cancel.onclick = function () { location.reload(); };
    save.onclick = function () {
      closePop();
      save.disabled = cancel.disabled = true;
      say("Saving…");
      artifact.publish(buildDoc()).then(function () {
        say("Saved.");
      }, function (err) {
        save.disabled = cancel.disabled = false;
        var c = err && err.code;
        say(c === "conflict" ? "Someone saved first. The page will reload." :
            (c === "not_writer" || c === "not_granted") ? "You can only view this page, so it cannot be saved." :
            "Could not save: " + ((err && err.message) || c || "unknown error"));
      });
    };

    document.addEventListener("click", function (e) {
      if (!on || inUi(e.target)) return;
      var svgText = e.target.closest && e.target.closest("svg text, svg tspan");
      if (svgText) {
        e.preventDefault();
        if (svgText.tagName.toLowerCase() === "text") {
          var first = svgText.querySelector("tspan");
          if (first) svgText = first;
        }
        editSvgText(svgText, e.clientX, e.clientY);
        return;
      }
      if (e.target.closest && e.target.closest("a,button,summary")) e.preventDefault();
    }, true);
    document.addEventListener("paste", function (e) {
      if (!on || !e.target.closest || !e.target.closest("[data-pg-edit]")) return;
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData("text");
      document.execCommand("insertText", false, t);
    }, true);
  }

  function start() {
    if (!window.claude || !window.claude.use || document.getElementById("pg-edit-ui")) return;
    window.claude.use("artifact").then(function (a) {
      if (!a || !a.publish) return;
      artifact = a;
      build();
    }, function () {});
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
